# Runtime network config, served to every origin from one generated file.
#
# Docker-only snippet (not in nginx/snippets/, which is what the deployed
# profile rsyncs). Included by every server block in nginx.docker.conf.template
# so the host shell, the sandbox and the protocol iframe cannot disagree about
# which chain they are on. Only documents need it: the protocol SharedWorker reads
# solely genesis and dotns, neither of which is overridable.
#
# no-store: restarting the container with a new config must take effect
# immediately, not after a cache expiry. The file is tiny.
#
# alias, not root: the file is generated into /etc/dotli at container start by
# docker/entrypoint.sh, outside any web root.
#
# Headers are spelled out rather than pulled from dotli-headers-*.conf, for two
# reasons. nginx *replaces* rather than merges add_header sets across contexts, so
# declaring Cache-Control here drops everything inherited and each location has to
# restate what it needs. And neither shared snippet fits: the iframeable one
# requires `$csp_ancestors`, which the host-build and apex blocks never set (nginx
# would refuse to load), while both snippets carry
# `Access-Control-Allow-Origin: *`, which these files specifically should not have
# — both consumers are same-origin (documents load the .js as a classic script,
# the SharedWorker fetches the .json from its own origin), and opening it up would
# make the effective config, private RPC URLs included, readable by any site for
# as long as the container runs.

location = /dotli-network.js {
    alias /etc/dotli/dotli-network.js;
    default_type application/javascript;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-store" always;
}

