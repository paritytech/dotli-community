# Docker only (the deployed profile rsyncs nginx/snippets/). Every server block includes it, so all origins agree on
# the chain. no-store so a restart with a new config applies at once. alias because entrypoint.sh generates the file
# outside any web root.
# Headers are spelled out: the iframeable snippet needs $csp_ancestors, which the host and apex blocks never set, and
# both snippets send `Access-Control-Allow-Origin: *`, which would expose the config, private RPC URLs included, to
# any site.

location = /dotli-network.js {
    alias /etc/dotli/dotli-network.js;
    default_type application/javascript;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-store" always;
}

