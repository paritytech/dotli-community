# The default ruleset, minus known false positives.

title = "dot.li gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Chain-spec genesis files embed public SS58 account addresses (prefix 5...) that trip the generic-api-key heuristic but are not secrets."
paths = [
  '''packages/resolver/src/chain-specs/.*\.json$''',
]

[[allowlists]]
description = "Seity contacts test vector (produced by Seity profile-core): a throwaway registry lookup key and seed used only by unit tests, not a secret."
targetRules = ["generic-api-key"]
paths = [
  '''^packages/ui/tests/fixtures/seity-contacts-v1\.json$''',
]

[[allowlists]]
description = "TRUAPI_WIRE_SCHEMA_HASH is the public TrUAPI wire-schema fingerprint (published in @parity/truapi) that vendored truapi builds embed; it trips generic-api-key but is not a secret."
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = [
  '''TRUAPI_WIRE_SCHEMA_HASH\s*[:=]\s*["'][0-9a-f]{16}["']''',
]

[[allowlists]]
description = "Seity contacts test vectors hold public registry lookup keys and content digests (32-byte hex hashes) that trip generic-api-key but are not secrets."
targetRules = ["generic-api-key"]
paths = [
  '''packages/ui/tests/fixtures/seity-contacts-v\d+\.json$''',
]

[[allowlists]]
description = "The resolver mapping-slot test uses a repeating public hexadecimal pattern, not a credential. Scope this exception to that exact value and test file."
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''^packages/resolver/tests/abi\.test\.ts$''',
]
regexTarget = "secret"
regexes = [
  '''^0x(?:1234567890abcdef){4}$''',
]

[[allowlists]]
description = "The Cloudflare TURN response test fixture uses this synthetic descending-hex credential, not a deployed secret. Match only the exact fixture value and path, including historical revisions."
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''^scripts/mint-media-turn\.test\.ts$''',
]
regexTarget = "secret"
regexes = [
  '''^e9f8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9c8b7a6f5e4d3c2b1a0f9e8$''',
]
