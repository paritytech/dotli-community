name: Bundle Size

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - "**.md"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bundle-size-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Flag mode-specific bundles that exceed budget. If
  # `apps/protocol/dist/assets/index-*.js` exceeds 600 KB raw, it almost
  # certainly means a static smoldot or chain-specs import crept back into
  # the protocol iframe's cold-start chunk — which silently inflates
  # RPC-mode users by ~3 MB. Overages emit a workflow warning but do NOT
  # fail the job: the signal belongs in review, not the required-checks
  # gate.
  budget:
    name: Continuous Integration
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bunx --bun turbo run build:prod

      - name: Check mode-specific bundle budgets
        run: bun scripts/bundle-size-report.ts --budget-only

  record:
    name: Weekly Report
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The cron fires on Monday, but the week being recorded ended at
      # Monday 00:00 UTC, so resolve the commit by date rather than trusting
      # HEAD. The pathspec exclusions skip the bot's own report commits: a
      # week whose last merge is the report PR must still point at the commit
      # that actually moved the bundle.
      - name: Resolve the week to record
        id: week
        run: |
          week_end=$(date -u -d 'last monday 00:00' +%Y-%m-%dT%H:%M:%SZ)
          sha=$(git rev-list -1 --first-parent --before="$week_end" origin/main -- \
                  ':(exclude)docs/bundle-size.md' ':(exclude)docs/assets/bundle-size-history.json')
          if [ -z "$sha" ]; then
            echo "No commit on main before ${week_end}, nothing to record."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "week=$(date -u -d 'last monday' +%G-W%V)" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      # The report branch, not main, is the source of truth for history. A
      # weekly PR needs a human approval, so it can sit unmerged for weeks;
      # reading the branch back means each run adds a row to the open PR
      # instead of overwriting the weeks that have not landed yet.
      - name: Restore history from the open report branch
        if: steps.week.outputs.skip != 'true'
        run: |
          if git ls-remote --exit-code --heads origin chore/bundle-size-report; then
            git fetch origin chore/bundle-size-report
            git checkout FETCH_HEAD -- docs/assets/bundle-size-history.json docs/bundle-size.md
          fi

      - name: Check out the measured commit
        if: steps.week.outputs.skip != 'true'
        run: git worktree add /tmp/measure ${{ steps.week.outputs.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Build the measured commit
        if: steps.week.outputs.skip != 'true'
        working-directory: /tmp/measure
        run: |
          bun install --frozen-lockfile
          bunx --bun turbo run build:prod
          find apps/*/dist -name '*.map' -delete

      # Runs the current script against the old checkout, so a commit that
      # predates this tooling can still be measured.
      - name: Record the week
        if: steps.week.outputs.skip != 'true'
        working-directory: /tmp/measure
        run: |
          bun "${GITHUB_WORKSPACE}/scripts/bundle-size-report.ts" --record \
            --sha ${{ steps.week.outputs.sha }} \
            --week ${{ steps.week.outputs.week }} \
            --history "${GITHUB_WORKSPACE}/docs/assets/bundle-size-history.json" \
            --out "${GITHUB_WORKSPACE}/docs/bundle-size.md"

      - name: Open or update the report PR
        if: steps.week.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          branch: chore/bundle-size-report
          delete-branch: true
          title: "chore(bundle-size): weekly report"
          commit-message: "chore(bundle-size): record the weekly bundle size"
          body: |
            ## Summary

            - Records the bundle size of `main` at the last merge of the week.
            - Regenerates the chart and tables in `docs/bundle-size.md`.
            - Rows accumulate here until this lands, so a late merge loses nothing.
          add-paths: |
            docs/bundle-size.md
            docs/assets/bundle-size-history.json
