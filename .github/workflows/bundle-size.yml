name: Bundle Size

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - "**.md"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bundle-size-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A protocol entry over budget means smoldot or chain specs crept back into
  # the iframe's cold-start chunk, costing RPC-mode users ~3 MB. Warns only:
  # the signal belongs in review, not the required-checks gate.
  budget:
    name: Continuous Integration
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bunx --bun turbo run build:prod

      - name: Check mode-specific bundle budgets
        run: bun scripts/bundle-size-report.ts --budget-only

  record:
    name: Weekly Report
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      # Resolved by the script, not by shell date arithmetic: `date -d 'last
      # monday'` on a Monday means seven days back, which is the week before
      # the one this run is meant to record.
      - name: Resolve the week to record
        id: week
        run: |
          sha=$(bun scripts/bundle-size-report.ts --print-sha)
          if [ -z "$sha" ]; then
            echo "No commit on main for that week, nothing to record."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      # The report branch is the source of truth, not main: a weekly PR waits
      # on review, so each run appends to it rather than overwriting the weeks
      # that have not landed yet.
      - name: Restore history from the open report branch
        if: steps.week.outputs.skip != 'true'
        run: |
          if git ls-remote --exit-code --heads origin chore/bundle-size-report; then
            git fetch origin chore/bundle-size-report
            git checkout FETCH_HEAD -- docs/assets/bundle-size-history.json docs/bundle-size.md
          fi

      - name: Check out the measured commit
        if: steps.week.outputs.skip != 'true'
        run: git worktree add /tmp/measure ${{ steps.week.outputs.sha }}

      - name: Build the measured commit
        if: steps.week.outputs.skip != 'true'
        working-directory: /tmp/measure
        run: |
          bun install --frozen-lockfile
          bunx --bun turbo run build:prod
          find apps/*/dist -name '*.map' -delete

      # The script comes from HEAD so commits predating it can still be measured.
      - name: Record the week
        if: steps.week.outputs.skip != 'true'
        working-directory: /tmp/measure
        run: |
          bun "${GITHUB_WORKSPACE}/scripts/bundle-size-report.ts" --record \
            --sha ${{ steps.week.outputs.sha }} \
            --history "${GITHUB_WORKSPACE}/docs/assets/bundle-size-history.json" \
            --out "${GITHUB_WORKSPACE}/docs/bundle-size.md"

      - name: Open or update the report PR
        if: steps.week.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          branch: chore/bundle-size-report
          delete-branch: true
          title: "chore(bundle-size): weekly report"
          commit-message: "chore(bundle-size): record the weekly bundle size"
          body: |
            ## Summary

            - Records the bundle size of `main` at the last merge of the week.
            - Regenerates the chart and tables in `docs/bundle-size.md`.
            - Rows accumulate here until this lands, so a late merge loses nothing.
          add-paths: |
            docs/bundle-size.md
            docs/assets/bundle-size-history.json
