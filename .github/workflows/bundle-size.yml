name: Bundle Size

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - '**.md'

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  bundle-size:
    name: Continuous Integration
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.sender.type != 'Bot'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: ./.github/actions/setup-node

      # Metrics on, as deployed. Off, the Sentry SDK is swapped for a no-op and the sizes would leave it out.
      - name: Build
        env:
          VITE_METRICS: 'true'
        run: npx turbo run build:prod

      - name: Remove source maps
        run: find apps/*/dist -name '*.map' -delete

      # Overages warn in the PR comment but never fail the job. A protocol entry over 600 KB almost always means a
      # static smoldot or chain-specs import crept into the RPC-mode cold-start chunk.
      - name: Check mode-specific bundle budgets
        run: |
          : > /tmp/budget-warnings.md
          check() {
            local label=$1 glob=$2 max=$3
            local file
            file=$(ls $glob 2>/dev/null | head -1)
            if [[ -z "$file" ]]; then
              echo "::warning::${label}: no file matched $glob"
              echo "- \`${label}\`: no file matched \`${glob}\`" >> /tmp/budget-warnings.md
              return
            fi
            local size
            size=$(stat --format=%s "$file")
            if (( size > max )); then
              echo "::warning::${label} exceeded budget: ${size} B > ${max} B (${file})"
              local fmt_size fmt_max fmt_over
              fmt_size=$(awk "BEGIN {printf \"%.1f KB\", $size/1024}")
              fmt_max=$(awk "BEGIN {printf \"%.1f KB\", $max/1024}")
              fmt_over=$(awk "BEGIN {printf \"%.1f KB\", ($size-$max)/1024}")
              echo "- \`${label}\` exceeded budget: **${fmt_size}** > ${fmt_max} (+${fmt_over}) — \`${file#apps/}\`" >> /tmp/budget-warnings.md
            else
              echo "${label}: ${size} B (budget ${max} B) — ok"
            fi
          }
          check "protocol-iframe-entry" \
                "apps/protocol/dist/assets/index-*.js" \
                $((600 * 1024))
          check "host-entry" \
                "apps/host/dist/assets/index.astro_astro_type_script_index_0_lang.*.js" \
                $((600 * 1024))

          # Each eager path budget is about 10% over its measured gzip size.
          check_eager() {
            local label=$1 dist=$2 max=$3
            local json gz
            if ! json=$(node scripts/eager-path-size.ts "$dist"); then
              echo "::warning::${label}: could not measure the eager path in ${dist}"
              echo "- \`${label}\`: could not measure the eager path in \`${dist}\`" >> /tmp/budget-warnings.md
              return
            fi
            gz=$(echo "$json" | python3 -c "import json,sys; print(json.load(sys.stdin)['gz'])")
            if (( gz > max )); then
              echo "::warning::${label} exceeded budget: ${gz} B gzip > ${max} B"
              echo "- \`${label}\` exceeded budget: **${gz} B gzip** > ${max} B" >> /tmp/budget-warnings.md
            else
              echo "${label}: ${gz} B gzip (budget ${max} B) — ok"
            fi
          }
          check_eager "host-eager-path" apps/host/dist 168000
          check_eager "sandbox-eager-path" apps/sandbox/dist 87000

      - name: Download baseline from main
        if: github.event_name == 'pull_request'
        id: baseline
        uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477 # v27
        with:
          name: bundle-size-baseline
          workflow: bundle-size.yml
          branch: main
          path: /tmp/baseline
          if_no_artifact_found: warn

      - name: Generate bundle size report
        if: github.event_name == 'pull_request'
        run: |
          SIZE_THRESHOLD=512000  # 500 KB

          BASELINE_FILE="/tmp/baseline/bundle-baseline.json"
          if [[ -f "$BASELINE_FILE" ]]; then
            HAS_BASELINE=true
          else
            HAS_BASELINE=false
            echo "::warning::No baseline found — sizes shown without comparison"
          fi

          fmt() {
            local bytes=$1
            if (( bytes >= 1048576 )); then
              awk "BEGIN {printf \"%.2f MB\", $bytes/1048576}"
            elif (( bytes >= 1024 )); then
              awk "BEGIN {printf \"%.1f KB\", $bytes/1024}"
            else
              echo "${bytes} B"
            fi
          }

          fmt_diff() {
            local current=$1 base=$2
            if [[ -z "$base" ]] || (( base == 0 )); then
              echo ""
              return
            fi
            local diff=$((current - base))
            if (( diff == 0 )); then
              echo ""
              return
            fi

            local abs_diff=$diff
            (( abs_diff < 0 )) && abs_diff=$((-diff))
            local formatted
            formatted=$(fmt $abs_diff)

            if (( diff > 0 )); then
              echo " (+${formatted})"
            else
              echo " (-${formatted})"
            fi
          }

          cell() {
            echo "$(fmt $1)$(fmt_diff $1 "$2")"
          }

          rows=""
          large_rows=""
          eager_rows=""
          # A tab is whitespace to `read`, so empty fields would collapse. Only the trailing base fields may be empty.
          while IFS=$'\t' read -r kind name count raw br gz base_raw base_br base_gz; do
            case "$kind" in
              file)
                label="\`${name}\`"
                if (( count > 1 )); then
                  label="${label} (×${count})"
                fi
                row="| ${label} | $(cell $raw "$base_raw") | $(cell $br "$base_br") | $(cell $gz "$base_gz") |"
                rows="${rows}${row}"$'\n'
                if (( raw >= SIZE_THRESHOLD )); then
                  large_rows="${large_rows}${row}"$'\n'
                fi
                ;;
              eager)
                eager_rows="${eager_rows}| \`${name}\` | $(cell $raw "$base_raw") | $(cell $br "$base_br") | $(cell $gz "$base_gz") |"$'\n'
                ;;
              total)
                total_raw_fmt=$(cell $raw "$base_raw")
                total_br_fmt=$(cell $br "$base_br")
                total_gz_fmt=$(cell $gz "$base_gz")
                br_pct=$(awk "BEGIN {printf \"%.0f\", (1 - $br/$raw) * 100}")
                ;;
            esac
          done < <(node scripts/bundle-sizes.ts compare "$BASELINE_FILE" host sandbox)

          {
            echo "## Bundle Size Report"
            echo ""
            if [[ -s /tmp/budget-warnings.md ]]; then
              echo "> [!WARNING]"
              echo "> **Bundle budget exceeded** — not a blocker, but please confirm the regression is intentional."
              echo ">"
              while IFS= read -r line; do echo "> ${line}"; done < /tmp/budget-warnings.md
              echo ""
            fi
            if ! $HAS_BASELINE; then
              echo "> No baseline found on \`main\`. Merge to \`main\` to establish a baseline."
              echo ""
            fi

            if [[ -n "$eager_rows" ]]; then
              echo "**Eager path** (module entry + modulepreloaded chunks):"
              echo ""
              echo "| Path | Raw | Brotli | Gzip |"
              echo "|------|----:|-------:|-----:|"
              echo -n "$eager_rows"
              echo ""
            fi

            if [[ -n "$large_rows" ]]; then
              echo "**Chunks over 500 KB:**"
              echo ""
              echo "| File | Raw | Brotli | Gzip |"
              echo "|------|----:|-------:|-----:|"
              echo -n "$large_rows"
              echo "| **Total** | **${total_raw_fmt}** | **${total_br_fmt}** (compression rate: ${br_pct}%) | **${total_gz_fmt}** |"
            else
              echo "No chunks over 500 KB."
              echo ""
              echo "**Total:** ${total_raw_fmt} raw / ${total_br_fmt} brotli (compression rate: ${br_pct}%) / ${total_gz_fmt} gzip"
            fi

            echo ""
            echo "<details>"
            echo "<summary>All files</summary>"
            echo ""
            echo "| File | Raw | Brotli | Gzip |"
            echo "|------|----:|-------:|-----:|"
            echo -n "$rows"
            echo "| **Total** | **${total_raw_fmt}** | **${total_br_fmt}** (compression rate: ${br_pct}%) | **${total_gz_fmt}** |"
            echo ""
            echo "</details>"
            echo ""
            SHORT_SHA="${GITHUB_SHA:0:7}"
            echo "<sub>Commit: [${SHORT_SHA}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})</sub>"
          } > /tmp/comment-body.md

      - name: Post or update PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/comment-body.md', 'utf8');
            const marker = '## Bundle Size Report';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Generate baseline sizes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/bundle-sizes.ts baseline host sandbox > /tmp/bundle-baseline.json

      - name: Upload baseline artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-size-baseline
          path: /tmp/bundle-baseline.json
          retention-days: 90
          overwrite: true
