name: Static Analysis
on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  lint:
    name: Continuous Integration
    runs-on: ubuntu-latest
    if: ${{ github.event.sender.type != 'Bot' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          # Per job: jobs sharing one key would race to save it and only the
          # first job's task results would be kept.
          key: ${{ runner.os }}-turbo-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.workflow }}-${{ github.job }}-

      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npx turbo run lint lint:root

      - name: Type check
        run: npx turbo run typecheck typecheck:root
