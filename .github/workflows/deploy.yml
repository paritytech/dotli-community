name: Deploy

on:
  pull_request:
    types: [labeled, synchronize]
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  plan:
    name: Plan deploy
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.plan.outputs.environments }}
      ref: ${{ steps.plan.outputs.ref }}
    steps:
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ADDED_LABEL: ${{ github.event.label.name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # PR labels may target only these development environments.
          ALLOWED='["paseoli.dev","paseo.fyi"]'
          case "$EVENT_NAME" in
            release)
              echo 'environments=["paseo.li","testnet.li"]' >> "$GITHUB_OUTPUT"
              echo "ref=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
              ;;
            push)
              echo 'environments=["paseoli.dev"]' >> "$GITHUB_OUTPUT"
              echo "ref=" >> "$GITHUB_OUTPUT"
              ;;
            pull_request)
              # On `labeled` only the added label counts, on `synchronize` every label on the PR.
              if [ "$ACTION" = "labeled" ]; then
                CANDIDATES="$(jq -nc --arg l "$ADDED_LABEL" '[$l]')"
              else
                CANDIDATES="$PR_LABELS"
              fi
              ENVS="$(jq -nc --argjson cands "$CANDIDATES" --argjson allowed "$ALLOWED" '
                [ $cands[]
                  | select(type == "string" and startswith("deploy: "))
                  | ltrimstr("deploy: ")
                  | select(IN($allowed[])) ]
                | unique')"
              echo "environments=$ENVS" >> "$GITHUB_OUTPUT"
              echo "ref=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
              ;;
          esac

  quality-gate:
    name: Quality Gate
    needs: plan
    if: needs.plan.outputs.environments != '[]'
    runs-on: ubuntu-latest
    # A newer push to the same PR or branch cancels this gate, so the superseded run never deploys.
    concurrency:
      group: deploy-gate-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
      cancel-in-progress: true
    steps:
      # The commit the deploy builds. A PR's default checkout is its merge commit, which the deploy never builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref || github.sha }}

      - uses: ./.github/actions/setup-node

      # The PR checks' own scripts, so whatever deploys passes them too.
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unused files, exports and dependencies
        run: npm run knip

      - name: Unit tests
        run: npm test

  deploy:
    name: Deploy ${{ matrix.environment }}
    needs: [plan, quality-gate]
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    # One deploy per environment at a time, whichever event started it. A running deploy is never cut mid-rsync.
    concurrency:
      group: deploy-env-${{ matrix.environment }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.plan.outputs.environments) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref || github.sha }}
          # The Sentry release is named from the newest tag, and its upload reads the commits since the previous one.
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Sync package versions to release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/set-version.ts "$RELEASE_TAG"

      # No VITE_COMMIT_SHA: the build reads it from the checkout, which is the PR head on a PR deploy.
      - run: npx turbo run build:prod
        env:
          VITE_APP_URL: ${{ vars.APP_URL }}
          VITE_APP_DEBUG: ${{ vars.APP_DEBUG }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_METRICS: ${{ secrets.VITE_METRICS }}
          VITE_NETWORKS: ${{ vars.NETWORKS }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - uses: ./.github/actions/setup-ssh
        with:
          private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}

      - name: Deploy
        run: make ci-deploy
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
