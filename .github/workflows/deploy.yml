name: Deploy

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: deploy-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan deploy
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.plan.outputs.environments }}
      smoke_environments: ${{ steps.plan.outputs.smoke_environments }}
      ref: ${{ steps.plan.outputs.ref }}
    steps:
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ADDED_LABEL: ${{ github.event.label.name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Environments a PR label is allowed to target (development only).
          ALLOWED='["paseoli.dev","paseo.fyi"]'
          case "$EVENT_NAME" in
            workflow_dispatch)
              echo 'environments=["westendli.dev"]' >> "$GITHUB_OUTPUT"
              echo 'smoke_environments=["westendli.dev"]' >> "$GITHUB_OUTPUT"
              echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
              ;;
            release)
              echo 'environments=["paseo.li","testnet.li"]' >> "$GITHUB_OUTPUT"
              echo "ref=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
              ;;
            push)
              echo 'environments=["paseoli.dev"]' >> "$GITHUB_OUTPUT"
              echo 'smoke_environments=["paseoli.dev"]' >> "$GITHUB_OUTPUT"
              echo "ref=" >> "$GITHUB_OUTPUT"
              ;;
            pull_request)
              # On `labeled` only the just-added label triggers a deploy; on
              # `synchronize` (new commit) consider all labels currently on the PR.
              if [ "$ACTION" = "labeled" ]; then
                CANDIDATES="$(jq -nc --arg l "$ADDED_LABEL" '[$l]')"
              else
                CANDIDATES="$PR_LABELS"
              fi
              ENVS="$(jq -nc --argjson cands "$CANDIDATES" --argjson allowed "$ALLOWED" '
                [ $cands[]
                  | select(type == "string" and startswith("deploy: "))
                  | ltrimstr("deploy: ")
                  | select(IN($allowed[])) ]
                | unique')"
              echo "environments=$ENVS" >> "$GITHUB_OUTPUT"
              # Smoke whatever this label actually deployed. The old filter
              # named `westendli.dev`, which no PR label can select, so a
              # label deploy shipped published products without ever loading
              # one — that is how a broken product reached paseo.fyi unnoticed.
              SMOKE_ENVS="$ENVS"
              echo "smoke_environments=$SMOKE_ENVS" >> "$GITHUB_OUTPUT"
              echo "ref=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
              ;;
          esac

  quality-gate:
    name: Quality Gate
    needs: plan
    if: needs.plan.outputs.environments != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref || github.sha }}

      - uses: ./.github/actions/setup-node

      - name: Check formatting
        run: npx prettier --check "**/*.{ts,tsx,md}"

      - name: Lint
        run: npx turbo run lint

      - name: Type check
        run: npx turbo run typecheck
      - name: Verify PolkaVM runtime assets
        run: npm run check:polkavm-runtime

      - name: Unit tests
        run: npx turbo run test

  deploy:
    name: Deploy ${{ matrix.environment }}
    needs: [plan, quality-gate]
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.plan.outputs.environments) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref || github.sha }}

      - uses: ./.github/actions/setup-node

      # Sync every workspace package.json to the release tag
      - name: Sync package versions to release tag
        if: github.event_name == 'release'
        run: node scripts/set-version.ts "${{ github.event.release.tag_name }}"

      - run: npx turbo run build:prod
        env:
          VITE_APP_URL: ${{ vars.APP_URL }}
          VITE_APP_DEBUG: ${{ vars.APP_DEBUG }}
          VITE_COMMIT_SHA: ${{ needs.plan.outputs.ref || github.sha }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_METRICS: ${{ secrets.VITE_METRICS }}
          VITE_NETWORKS: ${{ vars.NETWORKS }}
          VITE_RECEIVING_RELAY_URL: ${{ vars.RECEIVING_RELAY_URL }}
          VITE_RECEIVING_PUSH_ORIGIN: ${{ vars.RECEIVING_PUSH_ORIGIN }}
          VITE_RECEIVING_VAPID_PUBLIC_KEY: ${{ vars.RECEIVING_VAPID_PUBLIC_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - run: ssh-keyscan ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      # Only these environments can opt into config updates. Validate routing
      # before config or frontend uploads; other environments stay dist-only.
      - name: Deploy identity proxy config
        if:
          (matrix.environment == 'dotli.dev' || matrix.environment == 'westendli.dev' || matrix.environment ==
          'paseo.fyi') && vars.DEPLOY_NGINX == 'true'
        run: |
          set -euo pipefail
          case "$DEPLOY_SITE" in
            dotli.dev) NGINX_ENV=dev-polkadot ;;
            westendli.dev) NGINX_ENV=dev-westend ;;
            paseo.fyi) NGINX_ENV=fyi-paseo ;;
            *) echo "Identity proxy rollout is not allowed for $DEPLOY_SITE"; exit 1 ;;
          esac
          make ci-deploy-nginx ENV="$NGINX_ENV"
        env:
          DEPLOY_SITE: ${{ matrix.environment }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          RECEIVING_CSP_FILE: ${{ vars.RECEIVING_RELAY_URL != '' && 'apps/host/dist/host-receiving-csp.conf' || '' }}
          RECEIVING_PUSH_ORIGIN: ${{ vars.RECEIVING_PUSH_ORIGIN }}
          RECEIVING_PROXY_PORT: ${{ vars.RECEIVING_PROXY_PORT }}

      - name: Deploy
        run: make ci-deploy
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: Smoke identity proxy
        if:
          (matrix.environment == 'dotli.dev' || matrix.environment == 'westendli.dev' || matrix.environment ==
          'paseo.fyi') && vars.DEPLOY_NGINX == 'true'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "https://${DEPLOY_SITE}/__dotli-identity/paseo/attester" \
            | jq -e 'type == "object" and (.attester | type == "string" and test("^0x[0-9a-fA-F]{64}$"))'
        env:
          DEPLOY_SITE: ${{ matrix.environment }}

  product-smoke:
    name: Smoke ${{ matrix.environment }} products
    needs: [plan, deploy]
    if: needs.plan.outputs.smoke_environments != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.plan.outputs.smoke_environments) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref || github.sha }}

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Smoke published PolkaVM products
        working-directory: apps/host
        run: npm run test:smoke:products -- --output=test-results/products
        env:
          DOTLI_SMOKE_ROOT: ${{ matrix.environment }}
          DOTLI_WEBGPU: '1'

      # Capability coverage against the deployed host: the paired E2E suite
      # only ever talks to a local build, so without this a deployment could
      # serve a host the published products cannot call.
      - name: Smoke published TrUAPI capabilities
        # Run even when a product smoke fails: a broken published product
        # and a broken host capability are separate findings.
        if: ${{ !cancelled() }}
        working-directory: apps/host
        run: npm run test:smoke:truapi -- --output=test-results/truapi
        env:
          DOTLI_SMOKE_ROOT: ${{ matrix.environment }}

      - name: Retain deployed product smoke diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployed-product-smoke-${{ matrix.environment }}-${{ github.run_attempt }}
          path: apps/host/test-results/
          retention-days: 3
          if-no-files-found: ignore
