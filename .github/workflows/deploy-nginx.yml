name: Deploy nginx

# Gated by the environment's protection rules and deployment branch policy. Snippets are shared by every site on a
# box, so a deploy to one environment reloads them for its neighbours too.

run-name: Deploy nginx to ${{ inputs.environment }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy the nginx config to'
        required: true
        type: choice
        options:
          - paseoli.dev
          - paseo.fyi
          - testnet.li
          - paseo.li

permissions:
  contents: read

concurrency:
  group: deploy-nginx-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy nginx to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GitHub environments are named by domain, the Makefile keys them by tag.
      - name: Resolve Makefile ENV
        id: env
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            paseo.li) TAG=paseo ;;
            paseoli.dev) TAG=dev-paseo ;;
            paseo.fyi) TAG=fyi-paseo ;;
            testnet.li) TAG=dev-test ;;
            *) echo "::error::No Makefile ENV for $ENVIRONMENT"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-ssh
        with:
          private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}

      - name: Deploy nginx config
        run: make deploy-nginx ENV="$ENV_TAG" REMOTE="$DEPLOY_USER@$DEPLOY_HOST"
        env:
          ENV_TAG: ${{ steps.env.outputs.tag }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
