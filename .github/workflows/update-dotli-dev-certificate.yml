name: Update dotli.dev certificate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-dotli-dev-certificate
  cancel-in-progress: false

jobs:
  update-certificate:
    name: Expand and activate certificate
    runs-on: ubuntu-latest
    environment: dotli.dev
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deployment host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: ssh-keyscan "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Expand certificate and reload nginx
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: make update-cert ENV=dev-polkadot REMOTE="$DEPLOY_USER@$DEPLOY_HOST"

      - name: Verify sandbox hostname
        env:
          CERTIFICATE_HOST: truapi-playground.app.dotli.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --head "https://$CERTIFICATE_HOST/"
          printf '' | openssl s_client \
            -connect "$CERTIFICATE_HOST:443" \
            -servername "$CERTIFICATE_HOST" \
            -verify_hostname "$CERTIFICATE_HOST" \
            -verify_return_error 2>/dev/null \
            | openssl x509 -noout -ext subjectAltName \
            | grep --fixed-strings 'DNS:*.app.dotli.dev'
