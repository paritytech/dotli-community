name: Dependency Audit
on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  audit:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Audit dependencies
        run: npm audit
