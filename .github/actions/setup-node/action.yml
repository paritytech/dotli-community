name: Setup Node
description:
  "Install Node (from .nvmrc), the npm pinned in package.json's packageManager, and the workspace dependencies. Requires
  checkout first."

runs:
  using: 'composite'
  steps:
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm

    # Node's bundled npm moves with each Node release, and how `npm ci` treats `allowScripts` and the lockfile follows
    # the npm version.
    - name: Install the pinned npm
      run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      shell: bash

    - name: Install dependencies
      run: npm ci
      shell: bash
