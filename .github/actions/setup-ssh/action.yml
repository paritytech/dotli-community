name: Setup SSH
description:
  'Load the deploy key into an agent and trust only the pinned host key. Fails when no host key is pinned. Requires
  checkout first.'

inputs:
  private-key:
    description: 'The deploy private key.'
    required: true
  known-hosts:
    description:
      'known_hosts lines for the deploy host, from the DEPLOY_KNOWN_HOSTS variable. The host field must equal
      DEPLOY_HOST.'
    required: true

runs:
  using: 'composite'
  steps:
    - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
      with:
        ssh-private-key: ${{ inputs.private-key }}

    # A key scanned at run time trusts whoever answers. An unpinned host fails here, never falls back to a scan.
    - name: Trust the pinned host key
      shell: bash
      env:
        KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: |
        set -euo pipefail
        if [ -z "$KNOWN_HOSTS" ]; then
          echo "::error::DEPLOY_KNOWN_HOSTS is not set. Add the deploy host's known_hosts line as a repository or environment variable (see DEPLOYMENT.md)."
          exit 1
        fi
        mkdir -p ~/.ssh
        printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
