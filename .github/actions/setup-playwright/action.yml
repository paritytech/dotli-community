name: Setup Playwright
description: 'Install Node dependencies and Playwright Chromium browser. Requires checkout first.'

runs:
  using: 'composite'
  steps:
    - name: Setup Node
      uses: ./.github/actions/setup-node

    # Run from apps/host so npx uses the workspace-pinned Playwright. A registry version installs a mismatched
    # browser and tests fail with "Executable doesn't exist".
    - name: Install Playwright browsers
      working-directory: apps/host
      run: npx playwright install --with-deps chromium
      shell: bash
