name: Setup Playwright
description: 'Install Node dependencies and Playwright browsers (Chromium by default). Requires checkout first.'

inputs:
  browsers:
    description: 'Space-separated Playwright browsers to install.'
    required: false
    default: 'chromium'

runs:
  using: 'composite'
  steps:
    - name: Setup Node
      uses: ./.github/actions/setup-node

    # Run from apps/host so npx resolves the workspace-pinned playwright
    # (@playwright/test in apps/host) instead of fetching the latest from the
    # registry. A version mismatch installs the wrong browser build and the
    # tests fail at launch with "Executable doesn't exist".
    - name: Install Playwright browsers
      working-directory: apps/host
      run: npx playwright install --with-deps ${{ inputs.browsers }}
      shell: bash
