# The session window's pages on the bare host, one exact location per path. The window is a top-level page that its
# opener talks to by postMessage, so it sends no Cross-Origin-Opener-Policy, which would cut that link, and no page may
# frame it. Host build headers.
location = /s/auth {
    try_files /session.html =404;
    include /etc/nginx/snippets/dotli-headers-host.conf;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
}
location = /s/signout {
    try_files /session.html =404;
    include /etc/nginx/snippets/dotli-headers-host.conf;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
}
location = /s/manage {
    try_files /session.html =404;
    include /etc/nginx/snippets/dotli-headers-host.conf;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
}
location = /s/sign {
    try_files /session.html =404;
    include /etc/nginx/snippets/dotli-headers-host.conf;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
}
