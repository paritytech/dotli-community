# The sign-in window's page on the bare host. It is a top-level window that its opener talks to by postMessage, so it
# sends no Cross-Origin-Opener-Policy, which would cut that link, and no page may frame it. Host build headers.
location = /__session {
    try_files /session.html =404;
    include /etc/nginx/snippets/dotli-headers-host.conf;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
}
