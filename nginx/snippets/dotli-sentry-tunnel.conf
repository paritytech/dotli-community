# Sentry tunnel - first-party endpoint for browser SDK envelopes, so error
# reporting survives ad-blockers that drop requests to *.sentry.io. The SDK
# posts to `tunnel: "/t"` (packages/metrics/src/sentry.ts) and nginx relays
# the envelope to the ingest API without inspecting it.
# Optional: only uploaded and included when SENTRY_DSN is set at
# `make deploy-nginx` time. Requires in the enclosing server block (both
# values are cut from the DSN `https://<key>@<ingest-host>/<project-id>`):
#   set $sentry_ingest  "<ingest-host>";
#   set $sentry_project "<project-id>";
location = /t {
    # Envelopes are opaque JSON/gzip POST bodies; tracing payloads can
    # exceed nginx's 1m default.
    client_max_body_size 5m;

    # Variables in proxy_pass make nginx resolve the ingest host per
    # request (cached `valid=300s`) instead of pinning IPs at reload, so
    # Sentry rotating ingest IPs can't strand us and a DNS hiccup can't
    # fail `nginx -t`. 127.0.0.53 is systemd-resolved (Ubuntu 24.04);
    # ipv6=off avoids dead AAAA routes on v4-only boxes.
    resolver 127.0.0.53 valid=300s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host $sentry_ingest;
    # Same-origin POSTs carry our domain's cookies; Sentry must never
    # receive them (client sets sendDefaultPii: false for the same reason).
    proxy_set_header Cookie "";

    proxy_ssl_server_name on;
    proxy_ssl_name $sentry_ingest;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    proxy_pass https://$sentry_ingest/api/$sentry_project/envelope/;
}
