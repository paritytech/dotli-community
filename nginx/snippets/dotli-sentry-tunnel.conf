# First-party Sentry tunnel, so error reports survive ad-blockers that drop *.sentry.io.
# Included only when SENTRY_DSN is set at `make deploy-nginx`. Requires in the enclosing server block,
# both cut from the DSN `https://<key>@<ingest-host>/<project-id>`:
#   set $sentry_ingest  "<ingest-host>";
#   set $sentry_project "<project-id>";
location = /t {
    # Tracing envelopes can exceed nginx's 1m default.
    client_max_body_size 5m;

    # A variable in proxy_pass resolves per request, so rotating ingest IPs or a DNS hiccup can't break a reload.
    # 127.0.0.53 is systemd-resolved. ipv6=off avoids dead AAAA routes on v4-only boxes.
    resolver 127.0.0.53 valid=300s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host $sentry_ingest;
    # Same-origin POSTs carry our cookies, and Sentry must never receive them.
    proxy_set_header Cookie "";

    proxy_ssl_server_name on;
    proxy_ssl_name $sentry_ingest;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    proxy_pass https://$sentry_ingest/api/$sentry_project/envelope/;
}
