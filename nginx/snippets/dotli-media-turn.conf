# Media TURN credentials - same-origin GET that mints short-lived Cloudflare
# TURN credentials for the host shell's relay-only Media calls
# (packages/ui/src/media-host.ts, mediaTurnIceServers). The Cloudflare API
# token stays on this server; the browser only ever sees the relay
# username/credential pair.
#
# Location-context body. Include only on the root and trusted shell servers,
# never on iframeable/sandbox origins, inside
#
#   location = /__dotli-media/turn {
#       limit_req zone=<site>_media_turn burst=... nodelay;
#       include /etc/nginx/dotli-private/<site>-media-turn.conf;
#       include /etc/nginx/snippets/dotli-media-turn.conf;
#   }
#
# with an environment-appropriate resolver in the enclosing server. The private
# include is written by `make deploy-nginx` (root:root 0600, never staged in
# /tmp) and sets:
#   set $media_turn_key_id        "<Cloudflare TURN key id>";
#   set $media_turn_authorization "Bearer <Cloudflare API token>";
# Both are empty when DOTLI_TURN_CLOUDFLARE_KEY_ID/_API_TOKEN were unset at
# deploy time; the route then answers 503 and calls cannot connect.

# Never record requests, and keep inherited debug logging from writing the
# upstream Authorization header.
access_log off;
error_log /dev/null crit;

# Same-origin browser requests need no OPTIONS/CORS endpoint. Reject calls
# from sandbox and product origins even when they target a shell hostname.
set $media_turn_origin_ok 0;
if ($http_origin = "") { set $media_turn_origin_ok 1; }
if ($http_origin = "http://$http_host") { set $media_turn_origin_ok 1; }
if ($http_origin = "https://$http_host") { set $media_turn_origin_ok 1; }
if ($media_turn_origin_ok = 0) { return 403; }
if ($http_sec_fetch_site !~ "^(|same-origin|none)$") { return 403; }
if ($request_method != GET) { return 405; }
if ($request_uri != "/__dotli-media/turn") { return 404; }
if ($media_turn_authorization = "") { return 503; }

# Credential lifetime in seconds. The client reuses credentials for the first
# two thirds of this, so a call started from them keeps its relay for at least
# the last third (Cloudflare allocations end when their credential expires).
set $media_turn_ttl 43200;

proxy_http_version 1.1;
proxy_method POST;
proxy_pass_request_headers off;
proxy_pass_request_body off;
proxy_set_header Host rtc.live.cloudflare.com;
proxy_set_header Connection "";
proxy_set_header Authorization $media_turn_authorization;
proxy_set_header Content-Type application/json;
proxy_set_header Accept application/json;
proxy_set_body '{"ttl":$media_turn_ttl}';

proxy_ssl_server_name on;
proxy_ssl_name rtc.live.cloudflare.com;
proxy_ssl_verify on;
proxy_ssl_verify_depth 3;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_connect_timeout 10s;
proxy_send_timeout 15s;
proxy_read_timeout 15s;
proxy_next_upstream off;
proxy_intercept_errors off;
proxy_cache off;
proxy_buffering off;
proxy_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering X-Accel-Charset Expires Cache-Control Set-Cookie Vary;
proxy_hide_header Set-Cookie;
proxy_hide_header Location;
proxy_hide_header Refresh;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
proxy_hide_header Cross-Origin-Resource-Policy;
add_header Cache-Control "no-store" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Allow GET always;
add_header Dotli-Media-Turn-Ttl $media_turn_ttl;

# Upstream status and body pass through: the client accepts only a credentialed
# turn:/turns: relay and treats anything else as no relay.
proxy_pass https://rtc.live.cloudflare.com/v1/turn/keys/$media_turn_key_id/credentials/generate;
