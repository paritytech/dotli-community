# Shared TLS parameters for all dot.li-family server blocks.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
ssl_prefer_server_ciphers off;

# Every name under the domain this config serves, product and sandbox origins included, is TLS through the wildcard
# certificates, so the policy covers subdomains. No preload, which is slow to undo. At server level it reaches every
# location without an add_header of its own. One that sets its own headers drops it, which is harmless once a page on
# the origin has set it.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
