# Shared TLS parameters for all dot.li-family server blocks.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
ssl_prefer_server_ciphers off;

# Every name under the domain this config serves, product and sandbox origins included, is TLS through the wildcard
# certificates, so the policy covers subdomains. No preload, which is slow to undo. At server level it reaches the
# pages, whose locations add no headers of their own. Asset and worker locations drop it, which is harmless once a page
# has set it.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
