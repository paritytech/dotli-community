# Include only on root and trusted shell servers, with an environment-appropriate
# resolver in the enclosing server (systemd-resolved on hosts, Docker DNS in images).
# Keep the route/method/header contract in sync with scripts/identity-proxy.ts.
location ^~ /__dotli-identity {
    access_log off;
    # Prevent inherited debug logging from recording proof/token headers or bodies.
    error_log /dev/null crit;
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_body_timeout 30s;

    set $identity_network "";
    set $identity_path "";
    # Match the original URI, not nginx's decoded/normalized path. No user-selected
    # upstream, encoded path, arbitrary query, or extra path segment is accepted.
    if ($request_uri ~ "^/__dotli-identity/(paseo|testnet)/(auth/challenges|auth/token|attester|usernames/available|usernames)([?]version=v1)?$") {
        set $identity_network $1;
        set $identity_path $2;
    }
    if ($identity_path = "") { return 404; }
    set $identity_route "$identity_path$is_args$args";
    if ($identity_route !~ "^(auth/challenges|auth/token|attester|usernames|usernames/available([?]version=v1)?)$") { return 404; }

    # Same-origin browser requests need no OPTIONS/CORS endpoint. Reject calls
    # from sandbox origins even when those calls target a trusted shell hostname.
    set $identity_origin_ok 0;
    if ($http_origin = "") { set $identity_origin_ok 1; }
    if ($http_origin = "http://$http_host") { set $identity_origin_ok 1; }
    if ($http_origin = "https://$http_host") { set $identity_origin_ok 1; }
    if ($identity_origin_ok = 0) { return 403; }
    if ($http_sec_fetch_site !~ "^(|same-origin|none)$") { return 403; }

    set $identity_method POST;
    if ($identity_path = attester) { set $identity_method GET; }
    if ($request_method != $identity_method) { return 405; }

    set $identity_upstream identity.dotspark.app;
    if ($identity_network = testnet) { set $identity_upstream identity-previewnet.dotspark.app; }
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Host $identity_upstream;
    proxy_set_header Connection "";
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Auth-ClientId $http_auth_clientid;
    proxy_set_header Auth-ClientProof $http_auth_clientproof;
    proxy_set_header Auth-Challenge $http_auth_challenge;
    proxy_set_header Cookie "";

    proxy_ssl_server_name on;
    proxy_ssl_name $identity_upstream;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_next_upstream off;
    proxy_intercept_errors off;
    proxy_cache off;
    proxy_buffering off;
    proxy_ignore_headers X-Accel-Redirect X-Accel-Expires Expires Cache-Control Set-Cookie;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Location;
    proxy_hide_header Refresh;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Cross-Origin-Resource-Policy;
    add_header Cache-Control "no-store" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Allow $identity_method always;

    # nginx does not follow redirects; hiding Location also prevents the browser
    # from following one. Upstream status and body, including errors, are preserved.
    proxy_pass https://$identity_upstream/api/v1/$identity_path$is_args$args;
}
