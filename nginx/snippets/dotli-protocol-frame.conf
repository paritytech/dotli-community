# The protocol build at /__protocol/ on a domain's root, which the host page frames. The build keeps its files at the
# root of its folder and its base adds the prefix, so a rewrite that stops there takes the prefix off (alias does not
# mix with try_files). Its document is revalidated, so a deploy reaches every shell at once, and a cached older frame
# never sends `listening` and fails.
# Requires in the enclosing server block:
#   set $csp_ancestors "...";
#   set $protocol_root "<the protocol build's folder>";
# Both locations re-include the headers, because add_header sets replace rather than merge across contexts.
location ^~ /__protocol/ {
    root $protocol_root;
    rewrite ^/__protocol/$ /index.html break;
    rewrite ^/__protocol/(.+)$ /$1 break;
    try_files $uri =404;
    include /etc/nginx/snippets/dotli-headers-iframeable.conf;
    expires -1;
}

# Asset filenames are content-hashed, so they cache forever.
location ^~ /__protocol/assets/ {
    root $protocol_root;
    rewrite ^/__protocol/(.+)$ /$1 break;
    try_files $uri =404;
    include /etc/nginx/snippets/dotli-headers-iframeable.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
