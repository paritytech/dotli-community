# WebDAV-backed /__dotli-mode/ store so the host shell's PUT and DELETE mode
# writes work on the self-hosted gateway, matching the preview server. Absent
# keys answer 204; present keys serve their stored body.
location /__dotli-mode/ {
    include /etc/nginx/snippets/dotli-headers-iframeable.conf;
    if ($request_method = OPTIONS) { return 204; }
    root /var/tmp/dotli-mode;
    client_body_temp_path /var/tmp/dotli-mode/.tmp;
    dav_methods PUT DELETE;
    create_full_put_path on;
    dav_access all:rw;
    error_page 404 = @dotli_mode_absent;
}
location @dotli_mode_absent {
    include /etc/nginx/snippets/dotli-headers-iframeable.conf;
    return 204;
}
