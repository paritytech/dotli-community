# The bare host's chunks and workers. The cross-origin isolated /__preview page starts a worker only when the worker
# script carries COEP itself. Asset filenames are content-hashed, so they cache forever.
location /assets/ {
    try_files $uri =404;
    include /etc/nginx/snippets/dotli-headers-host.conf;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
