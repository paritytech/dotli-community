        <script>
            // Pre-open the shared IndexedDB during HTML parse so it's ready
            // before main.ts executes. Overlaps IDB open (~10-50ms) with
            // module loading. Picked up by src/db.ts via window.__dotliDb.
            window.__dotliDb = new Promise(function(resolve, reject) {
                var req = indexedDB.open("dotli", 4);
                req.onupgradeneeded = function() {
                    var db = req.result;
                    if (!db.objectStoreNames.contains("cids"))
                        db.createObjectStore("cids", { keyPath: "label" });
                    if (!db.objectStoreNames.contains("chains"))
                        db.createObjectStore("chains", { keyPath: "chain" });
                    // v2: scheduled notifications + per-product id counters.
                    if (!db.objectStoreNames.contains("scheduled_notifications")) {
                        var s = db.createObjectStore("scheduled_notifications", { keyPath: "hostId", autoIncrement: true });
                        s.createIndex("byProductId", "productId", { unique: false });
                        s.createIndex("byScheduledAt", "scheduledAt", { unique: false });
                    }
                    if (!db.objectStoreNames.contains("notification_counters"))
                        db.createObjectStore("notification_counters", { keyPath: "productId" });
                    // v3: product chat rooms and messages.
                    if (!db.objectStoreNames.contains("chat_rooms"))
                        db.createObjectStore("chat_rooms", { keyPath: ["productId", "roomId"] });
                    if (!db.objectStoreNames.contains("chat_messages")) {
                        var c = db.createObjectStore("chat_messages", { keyPath: "seq", autoIncrement: true });
                        c.createIndex("byRoom", ["productId", "roomId"], { unique: false });
                    }
                    // v4: product chat bot identities.
                    if (!db.objectStoreNames.contains("chat_bots"))
                        db.createObjectStore("chat_bots", { keyPath: ["productId", "botId"] });
                };
                req.onsuccess = function() { resolve(req.result); };
                req.onerror = function() { reject(new Error("IDB open failed")); };
                // A still-open tab on an older schema blocks the upgrade;
                // reject instead of leaving the promise pending forever.
                req.onblocked = function() { reject(new Error("IDB open blocked by another tab")); };
            });
        </script>

    <body>
        <script>
            (function() {
                var pref = "system";
                try {
                    var stored = localStorage.getItem("dotli-theme");
                    if (stored === "light" || stored === "dark" || stored === "system") {
                        pref = stored;
                    }
                } catch (_) { /* localStorage unavailable: fall back to system */ }
                var theme = pref;
                if (theme === "system") {
                    theme = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
                }
                document.documentElement.setAttribute("data-theme-pref", pref);
                document.documentElement.setAttribute("data-theme", theme);
            })();
        </script>
        <div id="shell" style="display: contents"><!--ssr:shell--></div>

        <!-- Chat Panel (docked right; the panel runtime shrinks the product
             iframe while open, mirroring the debug panel's right dock).
             Contents are rendered by components/chat/ChatPanel.tsx. -->

                <div class="loading-progress" id="loading-progress" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <div class="loading-progress-bar">
                        <div class="loading-progress-fill" id="loading-progress-fill"></div>
                    </div>
                    <span class="loading-progress-pct" id="loading-progress-pct">0%</span>
                </div>
                <div class="loading-text" id="loading-text">
                    <!-- Held back until the load has run long enough to be
                         worth explaining. A fast load shows only the bar. -->
                    <div class="loading-status" id="loading-status">
                        <!-- The visible line is typed a character at a time, which
                             would make a live region announce every partial string,
                             so the announcement is split into its own hidden
                             element that only ever receives whole sentences. -->
                        <p id="status" aria-hidden="true">Reaching out</p>
                        <p class="sr-only" id="status-sr" aria-live="polite"></p>
                        <p class="loading-warning" id="loading-warning" role="status">
                            <svg class="loading-warning-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                                <path d="M8 1.6 15 14H1L8 1.6Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                                <path d="M8 6v3.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                                <circle cx="8" cy="11.8" r="0.85" fill="currentColor"/>
                            </svg>
                            <span id="loading-warning-text"></span>
                        </p>
                    </div>
                </div>
            </div>
        </div>
        <script>
            // Logo spinner, rAF-driven for smooth petal cycling
            (function(){
                var petals = document.querySelectorAll('.loading-petal');
                if (!petals.length) return;
                if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                var count = petals.length;
                var cycle = 1400;
                var start = null;
                var raf;
                function tick(ts) {
                    if (!start) start = ts;
                    var p = ((ts - start) % cycle) / cycle;
                    for (var i = 0; i < count; i++) {
                        var dist = p - i / count;
                        if (dist < 0) dist += 1;
                        var b = Math.max(0.15, Math.pow(Math.max(0, 1 - dist * 2.5), 2));
                        petals[i].style.opacity = b;
                        petals[i].style.transform = 'scale(' + (0.92 + 0.08 * b) + ')';
                    }
                    raf = requestAnimationFrame(tick);
                }
                raf = requestAnimationFrame(tick);
                // Stop when loading is replaced
                window.__stopLoadingSpinner = function() { cancelAnimationFrame(raf); };
            })();
        </script>
        <script type="module" src="/src/main.ts"></script>
