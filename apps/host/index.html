        <script>
            // Pre-open the shared IndexedDB during HTML parse so it's ready
            // before main.ts executes. Overlaps IDB open (~10-50ms) with
            // module loading. Picked up by src/db.ts via window.__dotliDb.
            window.__dotliDb = new Promise(function(resolve, reject) {
                var req = indexedDB.open("dotli", 4);
                req.onupgradeneeded = function() {
                    var db = req.result;
                    if (!db.objectStoreNames.contains("cids"))
                        db.createObjectStore("cids", { keyPath: "label" });
                    if (!db.objectStoreNames.contains("chains"))
                        db.createObjectStore("chains", { keyPath: "chain" });
                    // v2: scheduled notifications + per-product id counters.
                    if (!db.objectStoreNames.contains("scheduled_notifications")) {
                        var s = db.createObjectStore("scheduled_notifications", { keyPath: "hostId", autoIncrement: true });
                        s.createIndex("byProductId", "productId", { unique: false });
                        s.createIndex("byScheduledAt", "scheduledAt", { unique: false });
                    }
                    if (!db.objectStoreNames.contains("notification_counters"))
                        db.createObjectStore("notification_counters", { keyPath: "productId" });
                    // v3: product chat rooms and messages.
                    if (!db.objectStoreNames.contains("chat_rooms"))
                        db.createObjectStore("chat_rooms", { keyPath: ["productId", "roomId"] });
                    if (!db.objectStoreNames.contains("chat_messages")) {
                        var c = db.createObjectStore("chat_messages", { keyPath: "seq", autoIncrement: true });
                        c.createIndex("byRoom", ["productId", "roomId"], { unique: false });
                    }
                    // v4: product chat bot identities.
                    if (!db.objectStoreNames.contains("chat_bots"))
                        db.createObjectStore("chat_bots", { keyPath: ["productId", "botId"] });
                };
                req.onsuccess = function() { resolve(req.result); };
                req.onerror = function() { reject(new Error("IDB open failed")); };
            });
        </script>

            (function() {
                var pref = "system";
                try {
                    var stored = localStorage.getItem("dotli-theme");
                    if (stored === "light" || stored === "dark" || stored === "system") {
                        pref = stored;
                    }
                } catch (_) { /* localStorage unavailable: fall back to system */ }
                var theme = pref;
                if (theme === "system") {
                    theme = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
                }
                document.documentElement.setAttribute("data-theme-pref", pref);
                document.documentElement.setAttribute("data-theme", theme);
            })();
        </script>

        <script>
            // Logo spinner, rAF-driven for smooth petal cycling
            (function(){
                var petals = document.querySelectorAll('.loading-petal');
                if (!petals.length) return;
                var count = petals.length;
                var cycle = 1400;
                var start = null;
                var raf;
                function tick(ts) {
                    if (!start) start = ts;
                    var p = ((ts - start) % cycle) / cycle;
                    for (var i = 0; i < count; i++) {
                        var dist = p - i / count;
                        if (dist < 0) dist += 1;
                        var b = Math.max(0.15, Math.pow(Math.max(0, 1 - dist * 2.5), 2));
                        petals[i].style.opacity = b;
                        petals[i].style.transform = 'scale(' + (0.92 + 0.08 * b) + ')';
                    }
                    raf = requestAnimationFrame(tick);
                }
                raf = requestAnimationFrame(tick);
                // Stop when loading is replaced
                window.__stopLoadingSpinner = function() { cancelAnimationFrame(raf); };
            })();
        </script>
